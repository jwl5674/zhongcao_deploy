<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>商家管理中心</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f5f6fa; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
        #app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
        .header { background: #1989fa; color: #fff; padding: 16px 20px; font-size: 18px; font-weight: 600; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .header .logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 4px 14px; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .form-wrap { padding: 20px 16px; }
        .field-group { padding: 8px 0; }
        .field-group label { display: block; font-size: 14px; color: #333; margin-bottom: 4px; font-weight: 500; }
        .field-group label .required { color: #ee0a24; margin-right: 2px; }
        .field-group input, .field-group select, .field-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: #fff; }
        .field-group textarea { min-height: 80px; resize: vertical; }
        .field-group select { appearance: auto; }
        .field-group .tag-group { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
        .field-group .tag-item { padding: 6px 14px; border-radius: 16px; font-size: 13px; border: 1.5px solid #ddd; cursor: pointer; transition: all 0.2s; background: #fff; color: #666; }
        .field-group .tag-item.active { border-color: #1989fa; background: #e8f3ff; color: #1989fa; }
        .field-group .tag-item.custom-tag { border-style: dashed; }
        .field-group .tag-input-wrap { display: flex; gap: 8px; margin-top: 6px; }
        .field-group .tag-input-wrap input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
        .field-group .tag-input-wrap button { padding: 8px 16px; background: #1989fa; color: #fff; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .form-actions { display: flex; gap: 12px; margin-top: 24px; padding-bottom: 20px; }
        .form-actions button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .form-actions .btn-save { background: #1989fa; color: #fff; }
        .form-actions .btn-preview { background: #07c160; color: #fff; }
        .toast-tip { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 2000; pointer-events: none; }
        .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f6fa; padding: 20px; }
        .login-box { background: #fff; padding: 32px 24px; border-radius: 16px; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .login-box .logo { text-align: center; font-size: 36px; margin-bottom: 4px; }
        .login-box .title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .login-box .sub { text-align: center; font-size: 13px; color: #999; margin-bottom: 20px; }
        .login-box .field-group { padding: 6px 0; }
        .login-box .login-btn { width: 100%; padding: 12px; background: #1989fa; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 12px; }
        .login-box .login-btn:active { opacity: 0.8; }
        .login-box .error-msg { color: #ee0a24; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
        .btn-sm { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .btn-primary { background: #1989fa; color: #fff; }
        .btn-success { background: #07c160; color: #fff; }
        .media-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; flex-shrink: 0; }
        .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
        .media-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 20px; text-align: center; }
        .loading-text { text-align: center; padding: 40px 0; color: #999; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 登录界面 -->
        <div v-if="!isLoggedIn" class="login-wrap">
            <div class="login-box">
                <div class="logo">📱</div>
                <div class="title">商家管理中心</div>
                <div class="sub">登录后管理你的种草卡配置</div>
                <div class="field-group">
                    <label>手机号</label>
                    <input type="text" v-model="loginForm.phone" placeholder="请输入手机号" />
                </div>
                <div class="field-group">
                    <label>密码</label>
                    <input type="password" v-model="loginForm.password" placeholder="请输入密码" @keydown.enter="handleLogin" />
                </div>
                <button class="login-btn" @click="handleLogin">登 录</button>
                <div class="error-msg" ref="loginError">❌ 手机号或密码错误</div>
            </div>
        </div>

        <!-- 配置界面 -->
        <div v-else>
            <div class="header">
                <span>📋 商铺信息配置</span>
                <button class="logout-btn" @click="handleLogout">退出登录</button>
            </div>

            <div v-if="loadingProfile" class="loading-text">加载中...</div>
            <div v-else class="form-wrap">
                <div v-if="merchantData.status === 'disabled'" style="background:#fce4ec;padding:12px 16px;border-radius:8px;color:#c62828;font-size:14px;margin-bottom:16px;">
                    ⚠️ 账号已被禁用，请联系管理员
                </div>

                <div class="field-group">
                    <label><span class="required">*</span> 商铺名称</label>
                    <input type="text" v-model="form.shopName" placeholder="请输入商铺名称" />
                </div>

                <div class="field-group">
                    <label>商铺Logo</label>
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <div v-if="form.shopLogo" style="width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid #ddd;flex-shrink:0;">
                            <img :src="form.shopLogo" style="width:100%;height:100%;object-fit:cover;" />
                        </div>
                        <div v-else style="width:64px;height:64px;border-radius:50%;background:#f0f0f0;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px;flex-shrink:0;">暂无</div>
                        <input type="file" id="logoUpload" accept="image/*" style="display:none;" @change="handleLogoUpload" />
                        <button type="button" class="btn-sm btn-primary" @click="document.getElementById('logoUpload').click()">📷 上传Logo</button>
                        <span style="font-size:12px;color:#999;">（支持 JPG/PNG，≤5MB）</span>
                    </div>
                </div>

                <div class="field-group">
                    <label>商铺相册 / 视频</label>
                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
                        <div v-for="(item, index) in form.mediaList" :key="index" class="media-item">
                            <img v-if="item.type === 'image'" :src="item.url" />
                            <video v-else-if="item.type === 'video'" :src="item.url" muted></video>
                            <div v-else style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f5f6fa;color:#ccc;font-size:12px;">{{ item.type }}</div>
                            <button type="button" class="del-btn" @click="removeMedia(index)">✕</button>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none;" @change="handleMediaUpload" />
                            <button type="button" class="btn-sm btn-success" @click="document.getElementById('mediaUpload').click()">➕ 添加图片/视频</button>
                            <span style="font-size:12px;color:#999;">（支持 JPG/PNG/MP4，≤50MB）</span>
                        </div>
                    </div>
                </div>

                <div class="field-group">
                    <label><span class="required">*</span> 商铺类型</label>
                    <select v-model="form.shopType">
                        <option value="">请选择</option>
                        <option v-for="t in shopTypeOptions" :key="t" :value="t">{{ t }}</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><span class="required">*</span> 细分品类</label>
                    <select v-model="form.category">
                        <option value="">请选择</option>
                        <option v-for="c in categoryOptions" :key="c" :value="c">{{ c }}</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>核心卖点</label>
                    <div class="tag-group">
                        <span class="tag-item" v-for="tag in presetTags" :key="tag" :class="{ active: form.tags.includes(tag) }" @click="toggleTag(tag)">{{ tag }}</span>
                        <span class="tag-item custom-tag" v-for="tag in customTags" :key="tag" :class="{ active: form.tags.includes(tag) }" @click="toggleTag(tag)">{{ tag }} ✕</span>
                    </div>
                    <div class="tag-input-wrap">
                        <input type="text" v-model="newTag" placeholder="输入自定义卖点" @keydown.enter="addCustomTag" />
                        <button @click="addCustomTag">添加</button>
                    </div>
                </div>

                <div class="field-group">
                    <label>人均消费（元）</label>
                    <input type="number" v-model="form.avgPrice" placeholder="请输入人均消费" />
                </div>

                <div class="field-group">
                    <label>大众点评店铺ID</label>
                    <input type="text" v-model="form.dianpingShopId" placeholder="请输入大众点评店铺ID" />
                </div>

                <div class="field-group">
                    <label>视频号视频链接</label>
                    <input type="text" v-model="form.videoUrl" placeholder="请输入已发布的视频号视频链接" />
                </div>

                <div class="form-actions">
                    <button class="btn-save" @click="handleSave">💾 保存配置</button>
                    <button class="btn-preview" @click="handlePreview">👁️ 预览种草卡</button>
                </div>
            </div>
        </div>

        <div class="toast-tip" v-if="toastMsg">{{ toastMsg }}</div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
        const API_BASE = '';

        const app = createApp({
            setup() {
                const isLoggedIn = ref(false);
                const merchantData = ref({});
                const loadingProfile = ref(false);
                const toastMsg = ref('');
                let toastTimer = null;
                let token = '';

                const loginForm = reactive({ phone: '', password: '' });
                const loginError = ref(null);

                const form = reactive({
                    shopName: '',
                    shopLogo: '',
                    shopType: '',
                    category: '',
                    tags: [],
                    avgPrice: '',
                    dianpingShopId: '',
                    videoUrl: '',
                    mediaList: []
                });

                const presetTags = ['口味好', '分量大', '食材新鲜', '性价比高', '服务热情', '环境优美', '网红打卡', '回头客多', '适合聚餐', '适合约会'];
                const customTags = ref([]);
                const newTag = ref('');

                const shopTypeOptions = ['餐饮服务', '酒店住宿', '休闲娱乐', '美容美发', '教育培训', '生活服务'];
                const categoryMap = {
                    '餐饮服务': ['烧烤', '火锅', '川菜', '粤菜', '日料', '西餐', '奶茶', '咖啡', '烘焙', '小吃快餐'],
                    '酒店住宿': ['豪华酒店', '精品民宿', '经济连锁'],
                    '休闲娱乐': ['KTV', '密室逃脱', '剧本杀', '健身房', '电影院'],
                    '美容美发': ['美发', '美甲', '美容', 'SPA'],
                    '教育培训': ['早教', '学科培训', '兴趣班', '职业教育'],
                    '生活服务': ['家政', '维修', '洗车', '宠物']
                };
                const categoryOptions = computed(() => categoryMap[form.shopType] || []);

                function showToast(msg, duration) {
                    duration = duration || 1500;
                    toastMsg.value = msg;
                    if (toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toastMsg.value = ''; }, duration);
                }

                async function handleLogin() {
                    if (!loginForm.phone || !loginForm.password) {
                        showToast('请填写完整信息');
                        return;
                    }
                    try {
                        const res = await fetch(API_BASE + '/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ phone: loginForm.phone, password: loginForm.password })
                        });
                        const data = await res.json();
                        if (data.success) {
                            token = data.data.token;
                            merchantData.value = data.data.merchant;
                            localStorage.setItem('merchant_token', token);
                            localStorage.setItem('merchant_id', merchantData.value._id);
                            isLoggedIn.value = true;
                            showToast('登录成功！');
                            loadProfile();
                        } else {
                            if (loginError.value) {
                                loginError.value.style.display = 'block';
                                setTimeout(() => { loginError.value.style.display = 'none'; }, 2000);
                            }
                        }
                    } catch (e) {
                        showToast('网络错误');
                    }
                }

                function handleLogout() {
                    isLoggedIn.value = false;
                    token = '';
                    localStorage.removeItem('merchant_token');
                    localStorage.removeItem('merchant_id');
                    loginForm.phone = '';
                    loginForm.password = '';
                    showToast('已退出登录');
                }

                async function loadProfile() {
                    loadingProfile.value = true;
                    try {
                        const res = await fetch(API_BASE + '/api/merchant/profile/me', {
                            headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('merchant_token') || token) }
                        });
                        const data = await res.json();
                        if (data.success) {
                            const m = data.data;
                            merchantData.value = m;
                            form.shopName = m.shopName || '';
                            form.shopLogo = m.shopLogo || '';
                            form.shopType = m.shopType || '';
                            form.category = m.category || '';
                            form.tags = m.tags || [];
                            form.avgPrice = m.avgPrice || '';
                            form.dianpingShopId = m.dianpingShopId || '';
                            form.videoUrl = m.videoUrl || '';
                            form.mediaList = m.mediaList || [];
                            const presetSet = new Set(presetTags);
                            customTags.value = (m.tags || []).filter(t => !presetSet.has(t));
                        } else {
                            showToast('加载失败: ' + data.message);
                        }
                    } catch (e) {
                        showToast('网络错误');
                    } finally {
                        loadingProfile.value = false;
                    }
                }

                function checkLoginStatus() {
                    const savedToken = localStorage.getItem('merchant_token');
                    if (savedToken) {
                        token = savedToken;
                        isLoggedIn.value = true;
                        loadProfile();
                    }
                }

                function toggleTag(tag) {
                    const idx = form.tags.indexOf(tag);
                    if (idx > -1) { form.tags.splice(idx, 1); } else { form.tags.push(tag); }
                }

                function addCustomTag() {
                    const tag = newTag.value.trim();
                    if (!tag) return;
                    if (presetTags.includes(tag)) { showToast('该标签已存在预设中'); return; }
                    if (customTags.value.includes(tag)) { showToast('该标签已添加'); return; }
                    customTags.value.push(tag);
                    form.tags.push(tag);
                    newTag.value = '';
                }

                function handleLogoUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) { showToast('请上传图片文件'); return; }
                    if (file.size > 5 * 1024 * 1024) { showToast('Logo图片不能超过 5MB'); return; }
                    const reader = new FileReader();
                    reader.onload = function(e) { form.shopLogo = e.target.result;
                        showToast('✅ Logo上传成功'); };
                    reader.readAsDataURL(file);
                    event.target.value = '';
                }

                function handleMediaUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const isImage = file.type.startsWith('image/');
                    const isVideo = file.type.startsWith('video/');
                    if (!isImage && !isVideo) { showToast('请上传图片或视频文件'); return; }
                    if (file.size > 50 * 1024 * 1024) { showToast('文件不能超过 50MB'); return; }
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        form.mediaList.push({ type: isImage ? 'image' : 'video', url: e.target.result, file: file });
                        showToast('✅ 上传成功');
                    };
                    reader.readAsDataURL(file);
                    event.target.value = '';
                }

                function removeMedia(index) { form.mediaList.splice(index, 1);
                    showToast('已删除'); }

                async function handleSave() {
                    if (!form.shopName.trim()) { showToast('请输入商铺名称'); return; }
                    if (!form.shopType) { showToast('请选择商铺类型'); return; }
                    if (!form.category) { showToast('请选择细分品类'); return; }

                    try {
                        const res = await fetch(API_BASE + '/api/merchant/profile/me', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + (localStorage.getItem('merchant_token') || token)
                            },
                            body: JSON.stringify({
                                shopName: form.shopName,
                                shopLogo: form.shopLogo,
                                shopType: form.shopType,
                                category: form.category,
                                tags: form.tags,
                                avgPrice: form.avgPrice,
                                dianpingShopId: form.dianpingShopId,
                                videoUrl: form.videoUrl,
                                mediaList: form.mediaList
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            merchantData.value = data.data;
                            showToast('保存成功！✅');
                        } else {
                            showToast('保存失败: ' + data.message);
                        }
                    } catch (e) {
                        showToast('网络错误');
                    }
                }

                function handlePreview() {
                    const merchantId = merchantData.value._id || '1';
                    window.open('/card.html?merchantId=' + merchantId, '_blank');
                }

                onMounted(() => {
                    checkLoginStatus();
                });

                watch(() => form.shopType, () => { form.category = ''; });

                return {
                    isLoggedIn,
                    merchantData,
                    loadingProfile,
                    loginForm,
                    loginError,
                    form,
                    presetTags,
                    customTags,
                    newTag,
                    shopTypeOptions,
                    categoryOptions,
                    toastMsg,
                    handleLogin,
                    handleLogout,
                    toggleTag,
                    addCustomTag,
                    handleLogoUpload,
                    handleMediaUpload,
                    removeMedia,
                    handleSave,
                    handlePreview
                };
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
